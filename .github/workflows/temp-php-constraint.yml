name: Validate PHP platform constraint alignment

on:
  push:
    branches:
      - chore/align-php-platform-constraint
    paths:
      - "composer.json"
      - ".github/workflows/temp-php-constraint.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_SECRET: temporary-ci-secret
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/security_refresh?serverVersion=17&charset=utf8"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, pdo_pgsql
          tools: composer:v2
      - name: Refresh Composer lock metadata
        run: composer update --lock --no-scripts --no-interaction --no-progress
      - name: Validate Composer files
        run: composer validate --no-check-publish
      - name: Lint YAML configuration
        run: php bin/console lint:yaml config/
      - name: Lint Symfony container
        run: php bin/console lint:container --env=test
      - name: Commit refreshed lock metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- composer.lock; then
            echo "composer.lock metadata is already current"
          else
            git add composer.lock
            git commit -m "chore: sync Composer lock metadata"
            git push origin HEAD
          fi
      - name: Require clean security audit
        run: composer audit --locked
